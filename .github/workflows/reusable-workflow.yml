name: 'Reusable workflow'
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      runs-on:
        required: true
        type: string
      env-str:
        type: string

jobs:
  test-echo:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Set environment variables
        run: |
          echo "${{ inputs.env-str }}" >> "$GITHUB_ENV"
        shell: bash
      - run: env | grep MY_
        shell: bash
      - run: echo test 1
      - run: echo test 2
      - run: echo test 3
