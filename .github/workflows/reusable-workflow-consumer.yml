name: Reusable workflow consumer
permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  reusable-workflow-consumer:
    uses: ./.github/workflows/reusable-workflow.yml
    with:
      runs-on: ubuntu-latest
      env-str: |
        MY_BLA=1
        MY_FOO=1

  reusable-workflow-consumer-win:
    uses: ./.github/workflows/reusable-workflow.yml
    with:
      runs-on: windows-latest
      env-str: |
        MY_FOO=2
